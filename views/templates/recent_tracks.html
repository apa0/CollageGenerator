<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Tracks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .track-card {
            width: 180px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .color-box, .palette-color {
            width: 20px;
            height: 20px;
            display: inline-block;
            margin: 2px;
            border-radius: 4px;
        }
        .generate-btn {
            display: block;
            margin: 40px auto 0;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #1db954;
            color: white;
            border-radius: 8px;
        }
        .generate-btn:hover {
            background-color: #14833b;
        }
    </style>
     <style>
        .spotify-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 30px;">
        <h2>Recent Track Color Analysis</h2>
        <p>Scroll below or click the button to generate your personalized art collage! </p>
        <div style="display: inline-flex; gap: 10px; margin-top: 10px;">
            <form action="{{ url_for('recent.recent_tracks') }}" method="get">
                <input type="hidden" name="refresh" value="true">
                <button type="submit" class="spotify-button" style="background-color: #1976d2;">🔄 Refresh Tracks</button>
            </form>
            <form action="{{ url_for('collage.collage') }}" method="get">
                <button type="submit" class="spotify-button">🎨 Generate Collage</button>
            </form>
        </div>
    </div>
    <div class="grid-container">
        {% for track in recent_music %}
        <div class="track-card">
            <img src="{{ track.album_image_url }}" style="width: 100px; border-radius: 5px;"><br>
            <strong>{{ track.name }}</strong><br>
            <small>by {{ track.artist }}</small><br>
            <small><em>{{ track.genres }}</em></small><br>
            <div>
                <span style="font-size: 12px;">Dominant:</span>
                <div class="color-box" style="background-color: rgb({{ track.dominant_color[0] }}, {{ track.dominant_color[1] }}, {{ track.dominant_color[2] }});"></div>
            </div>
            <div>
                <span style="font-size: 12px;">Palette:</span><br>
                {% for color in track.color_palette %}
                    <div class="palette-color" style="background-color: rgb({{ color[0] }}, {{ color[1] }}, {{ color[2] }});"></div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
