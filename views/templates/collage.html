<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Art Collage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 40px;
        }
        .art-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .art-grid img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Your Matched Art Collage</h1>
    <div class="art-grid">
        {% for track in matched_tracks %}
            {% if track.matched_artwork %}
                <img src="{{ track.matched_artwork.image_url }}" alt="{{ track.matched_artwork.title }}">
            {% endif %}
        {% endfor %}
    </div>
</body>
</html>
