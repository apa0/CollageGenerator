<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Art Collage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 40px;
        }
        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .art-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .art-grid img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Your Art Collage</h1>
    <div class="art-grid">
        {% for track in matched_tracks %}
            {% if track.matched_artwork %}
                <img src="{{ track.matched_artwork }}" alt="Artwork">
            {% endif %}
        {% endfor %}
    </div>
</body>
</html>
